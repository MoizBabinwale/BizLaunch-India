<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" type="image/png" href="%PUBLIC_URL%/title-logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#2563EB" />
    <meta
      name="description"
      content="BizLaunch India is a directory for local businesses, services and stores. Browse by category and city, check timings and reviews, then call or send an enquiry."
    />
    <meta name="keywords" content="business directory India, local business search, find shops near me, business listing, service providers India" />
    <link rel="canonical" href="https://bizlaunchindia.com/" />

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="BizLaunch India" />
    <meta property="og:title" content="BizLaunch India | Search Local Businesses, Services &amp; Stores Near You" />
    <meta
      property="og:description"
      content="Find shops, restaurants, hospitals and service professionals in your city. Browse listed businesses, check timings and reviews, then call or send an enquiry."
    />
    <meta property="og:url" content="https://bizlaunchindia.com/" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="apple-touch-icon" href="%PUBLIC_URL%/title-logo.png" />
    <!--
      manifest.json provides metadata used when your web app is installed on a
      user's mobile device or desktop. See https://developers.google.com/web/fundamentals/web-app-manifest/
    -->
    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />
    <!--
      Notice the use of %PUBLIC_URL% in the tags above.
      It will be replaced with the URL of the `public` folder during the build.
      Only files inside the `public` folder can be referenced from the HTML.

      Unlike "/favicon.ico" or "favicon.ico", "%PUBLIC_URL%/favicon.ico" will
      work correctly both with client-side routing and a non-root public URL.
      Learn how to configure a non-root public URL by running `npm run build`.
    -->
    <title>BizLaunch India</title>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
    <script>
      // If we arrived here via 404.html, restore the originally requested URL
      // so the client-side router can render it instead of the home page.
      (function () {
        try {
          var target = sessionStorage.getItem("redirect");

          if (target) {
            sessionStorage.removeItem("redirect");
            var url = new URL(target);
            window.history.replaceState(null, "", url.pathname + url.search);
          }
        } catch (error) {
          /* storage unavailable - fall through to the home route */
        }
      })();
    </script>
    <!--
      This HTML file is a template.

      The build step will place the bundled scripts into the <body> tag.

      To begin the development, run `npm start` or `yarn start`.
      To create a production bundle, use `npm run build` or `yarn build`.
    -->
  </body>
</html>
